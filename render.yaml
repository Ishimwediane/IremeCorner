services:
  - type: web
    name: iremecorner-api-docs
    env: node
    buildCommand: echo "No build required for documentation server"
    startCommand: node swagger-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
    branch: main
    rootDir: server